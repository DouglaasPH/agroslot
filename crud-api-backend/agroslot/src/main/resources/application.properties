spring.application.name=agroslot

# Conexão com o banco (atenção: porta 5433, não 5432)
spring.datasource.url=jdbc:postgresql://localhost:5433/agroslot_db
spring.datasource.username=agroslot_user
spring.datasource.password=agroslot_pass_dev

# O banco já foi criado pelo schema.sql, então o Hibernate só CONFERE
spring.jpa.hibernate.ddl-auto=validate

# Mostra o SQL no console (ajuda a depurar)
spring.jpa.show-sql=true
