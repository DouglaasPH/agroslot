spring.application.name=agroslot

spring.datasource.url=jdbc:postgresql://localhost:5432/agroslot_db
spring.datasource.username=agroslot_user
spring.datasource.password=agroslot_pass_dev

# O banco já foi criado pelo schema.sql, então o Hibernate só CONFERE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket-name=agroslot.images

# Configurações JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:nao-responda@ecoa.com}