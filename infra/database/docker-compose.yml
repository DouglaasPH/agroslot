version: '3.9'

services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: agroslot_db

    environment:
      POSTGRES_DB: agroslot_db
      POSTGRES_USER: agroslot_user
      POSTGRES_PASSWORD: agroslot_pass_dev

    ports:
      - "5432:5432"

    volumes:
      # Persistência dos dados do banco
      - postgres_data:/var/lib/postgresql/data
      # Scripts de inicialização (executados na primeira subida)
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  postgres_data: